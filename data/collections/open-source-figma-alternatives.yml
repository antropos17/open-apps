entries:
  - slug: penpot
    pinned: true
    note: Best overall and the direct Figma replacement. Browser-based design and prototyping with components, variants, design tokens, CSS Grid and Flex layouts, code inspect, plugins and MCP. MPL-2.0, self-host with Docker or Kubernetes.
  - slug: open-design
    note: Best for generating designs with AI agents instead of drawing them. Turns coding-agent CLIs into a design engine for HTML prototypes, decks, PDFs and video, bring your own model. Apache-2.0; created April 2026.
