faq:
  - q: What is the best open-source Figma alternative?
    a: Penpot. It covers interface design and prototyping with components, variants, design tokens and flexible layouts, and runs in the browser or on your own servers.
  - q: Can I self-host a Figma alternative?
    a: Yes. Penpot self-hosts with Docker, Kubernetes and other options. OpenDesign runs as a local-first desktop and web app.
  - q: Is Penpot fully open source?
    a: The repository is MPL-2.0. The paid Penpot Enterprise plan adds organisation governance — an Admin Console, advanced permissions and SSO — on cloud or self-hosted.
