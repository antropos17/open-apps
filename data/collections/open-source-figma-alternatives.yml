editorial:
  introduction: Two open-source routes away from Figma. Penpot is the design and prototyping platform teams draw in together, self-hosted if you like; OpenDesign is for teams that would rather have an AI agent produce the prototype.
  selectionNote: >-
    Open-source design and prototyping applications with an OSI-approved licence
    and commits in the last 90 days. Penpot's maker presents it as an
