entries:
  - slug: agentconnect
    pinned: true
    note: Best for a team of agents across many channels. Roles, memory and access rules per agent; Slack, Telegram, Discord, Lark, Google Chat, GitHub, GitLab and Linear; starts with Docker Compose. Apache-2.0, two months old.
  - slug: centaur
    note: Best when every request needs its own clean machine. Each Slack thread gets a Kubernetes sandbox with shell, git and your tools, plus durable workflows and credential boundaries. The heaviest setup here — Kubernetes and a 1Password service account.
  - slug: opentag
    note: Best for keeping code on your own computer. One Slack teammate, one ACP coding agent, running against your checkout on a paired machine; requests queue while it is offline. MIT. The editor's match — it does not call itself a Claude Tag alternative.
ranking:
