entries:
  - slug: opencode
    pinned: true
    note: Best overall. A terminal coding agent with build and plan agents, models from many providers or local ones, and a beta desktop app. MIT, installable from every major package manager. The editor's match.
  - slug: qwen-code
    note: Best feature-for-feature match. Its README lists Claude Code's features beside its own — subagents, memory, skills, hooks, MCP, plan mode — and adds chat-app channels and multi-model runs. Apache-2.0.
  - slug: goose
    note: Best when the agent should do more than code. A Rust desktop app, CLI and API with 15+ providers and 70+ MCP extensions, governed under the Linux Foundation. Apache-2.0. The editor's match.
