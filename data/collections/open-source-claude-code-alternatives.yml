editorial:
  introduction: Three open-source agents that do Claude Code's job — work in your repository, edit files and run commands — without tying you to one model provider. OpenCode is the focused terminal agent; Qwen Code matches Claude Code feature by feature; Goose is a broader agent with a desktop app.
  selectionNote: >-
    AI coding agents that run as a CLI or desktop app, with an OSI-approved
    licence, an installable release and commits in the last 30 days. Archived
    or inactive projects are excluded. Each record's relation to Claude Code is
    the project's own words or marked as the editor's match. Checked against
    GitHub on 29 September 2026.
  lastReviewedAt: "2026-09-29"
faq:
  - q: What is the best open-source alternative to Claude Code?
    a: OpenCode for most people — a focused terminal agent that works with many providers. Qwen Code if you want the closest feature match. Goose if you also want a desktop app for non-coding work.
  - q: Can I use them with Claude models?
    a: Yes. All three work with Anthropic's API alongside other providers; Goose can also use an existing Claude subscription through ACP.
  - q: Can they run with local models?
    a: Yes. OpenCode supports local models, Qwen Code works with Ollama and vLLM, and Goose supports Ollama.
  - q: Is there an open-source Claude Code desktop app?
    a: OpenCode, Qwen Code and Goose each ship desktop apps. To run Claude Code itself in several parallel worktrees from a desktop app, see Emdash.
