editorial:
  introduction: Four self-hosted ways to run customer support without Zendesk. Zammad is the complete ticketing system; Chatwoot is built around live chat and messaging; FreeScout is the lightest shared inbox; Frappe Helpdesk brings SLAs and a customer portal.
  selectionNote: >-
    Self-hostable help desks and customer support platforms with an
    OSI-approved licence for the self-hosted core and commits in the last 90
    days. FreeScout and Chatwoot describe themselves as Zendesk alternatives;
    Zammad and Frappe Helpdesk are marked as the editor's match. Open-core
    limits are named in each verdict. Checked against GitHub and vendor
    documentation on 29 September 2026.
  lastReviewedAt: "2026-09-29"
faq:
  - q: What is the best self-hosted Zendesk alternative?
    a: Zammad for a full multi-channel ticketing system that is AGPL-3.0 throughout. Chatwoot if live chat and messaging apps are where your customers are. FreeScout if you want a simple shared inbox on minimal hosting.
  - q: Which one is completely free to self-host?
    a: Zammad and Frappe Helpdesk ship everything under AGPL-3.0. FreeScout's core is free but most official modules are paid. Chatwoot's MIT core is free, while Captain AI, SSO, SLA policies and some admin features need a paid plan.
  - q: Which one has an AI assistant?
    a: Chatwoot's Captain AI agent is a paid-plan feature. FreeScout offers AI-drafted replies through a free AI Integration module.
  - q: Can I run one on shared PHP hosting?
    a: FreeScout, which needs only PHP and MySQL, MariaDB or PostgreSQL. The others need Docker, Kubernetes or a Linux server with their own services.
