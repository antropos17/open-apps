entries:
  - slug: zammad
    pinned: true
    note: Best overall for a full ticketing system. Email, chat, phone and social media in one queue, a REST API, and Docker, Helm or DEB/RPM installs. AGPL-3.0 throughout, owned by the Zammad Foundation. The editor's match.
  - slug: chatwoot
    note: Best for live chat and messaging apps. One inbox for website chat, email, WhatsApp, Instagram and more, with a help centre. MIT core; Captain AI, SSO and SLA policies need a paid licence.
  - slug: freescout
    note: Best lightweight shared inbox. Pure PHP and MySQL, runs on shared hosting, unlimited agents and mailboxes. AGPL-3.0, but most official modules are paid one-time licences.
  - slug: frappe-helpdesk
    note: Best for SLAs and a customer portal. Assignment rules, a knowledge base and saved replies, on the Frappe Framework from the makers of ERPNext. AGPL-3.0. The editor's match.
