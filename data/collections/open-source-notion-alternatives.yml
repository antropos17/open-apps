editorial:
  introduction: Two open-source workspaces that cover what most teams use Notion for — pages, wikis and databases — with the data on your own devices or server. AppFlowy is the closest match on every platform; AFFiNE merges documents with a whiteboard.
  selectionNote: >-
    Workspace applications for documents and databases with an OSI-approved
    licence for the core, downloadable builds and commits in the last 30 days.
    Each record's relation to Notion is the project's own words or a repository
    topic. Checked against GitHub on 29 September 2026.
  lastReviewedAt: "2026-09-29"
faq:
  - q: Is there an open-source Notion alternative I can self-host?
    a: Yes. AppFlowy publishes a self-hosting guide for its server, and AFFiNE runs its server with Docker. Both also work locally without a server.
  - q: Which one has mobile apps?
    a: AppFlowy ships iOS and Android apps alongside macOS, Windows and Linux builds.
  - q: Are they fully open source?
    a: AppFlowy is AGPL-3.0. AFFiNE's client is MIT, but parts of its server are under an enterprise licence, and some features need a subscription.
