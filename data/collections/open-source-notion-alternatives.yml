entries:
  - slug: appflowy
    pinned: true
    note: Best for a Notion-style workspace everywhere. Pages, databases and AI on macOS, Windows, Linux, iOS and Android, with a guide for self-hosting the sync server. AGPL-3.0.
  - slug: affine
    note: Best if you think on a whiteboard as much as in documents. Docs, databases and an edgeless canvas are the same surface, with desktop apps and a Docker server. Open-core — the client is MIT, the server partly under an enterprise licence — and telemetry is on until you turn it off.
ranking:
