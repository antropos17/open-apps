entries:
  - slug: appsmith
    pinned: true
    note: Best overall and the cleanest licence. Admin panels, dashboards and internal tools on 25+ databases and any API, with Git versioning. The public repository is Apache-2.0 throughout; telemetry is on by default and can be turned off.
  - slug: tooljet
    note: Best for a built-in database and Python. 80+ components, ToolJet Database, 90+ data sources, JavaScript and Python in apps, and an MCP server for coding agents. AGPL core; AI generation, workflows and GitSync are paid.
  - slug: budibase
    note: Best for operations teams. Apps, automations and AI agents that handle requests and approvals, with unlimited users on the free self-hosted plan. GPL-3.0 core, paid features under BSL and a bundled proprietary query server.
