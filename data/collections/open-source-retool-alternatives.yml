faq:
  - q: What is the best open-source Retool alternative?
    a: Appsmith for most teams — it is widely used and its public repository is Apache-2.0. ToolJet if you want a built-in database and Python in apps. Budibase if your work is requests, approvals and automations.
  - q: Are they fully open source?
    a: Appsmith's repository is Apache-2.0, with paid plans on top. ToolJet keeps enterprise code in separate submodules. Budibase puts paid features under the Business Source License and ships a proprietary query server binary.
  - q: Do they send telemetry?
    a: Appsmith and ToolJet send usage telemetry by default and let you turn it off; Appsmith also sends a keep-alive ping either way. Check each project's settings before deploying.
  - q: Why isn't NocoBase listed?
    a: NocoBase's licence adds terms on top of Apache-2.0, including a ban on offering it as a hosted no-code or low-code service, so it is not an OSI-approved open-source licence.
